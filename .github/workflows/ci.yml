name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: job-application-mcp-rg
  AZURE_CONTAINER_APP: job-application-mcp
  ACR_NAME: cae4d18bcdfeacr
  ACR_LOGIN_SERVER: cae4d18bcdfeacr.azurecr.io
  IMAGE_NAME: job-application-mcp

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: f7e02443-8189-424c-a73f-af0b82e37a51
          tenant-id: fa4630b9-65b1-465d-9d71-2d6f9cb85a8b
          subscription-id: bcb925ac-7836-431c-b470-57fcf9e1cd24

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Deploy Container App
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify deployed image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          EXPECTED_IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

          echo "Expected: $EXPECTED_IMAGE"
          echo "Deployed: $DEPLOYED_IMAGE"

          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"

      - name: Verify application health
        run: |
          for attempt in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://job-application-mcp.happygrass-de5f577c.centralindia.azurecontainerapps.io/health" \
              || true)

            echo "Health check attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application is healthy."
              exit 0
            fi

            sleep 10
          done

          echo "Application health check failed."
          exit 1
