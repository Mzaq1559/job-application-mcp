services:
  - type: web
    name: job-application-mcp
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: job-application-mcp-db
          property: connectionString
      - key: MCP_AUTH_TOKENS
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6

databases:
  - name: job-application-mcp-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: job_application_mcp
